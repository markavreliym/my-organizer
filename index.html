<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Мой органайзер</title>



<meta name="theme-color" content="#17191F">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Органайзер">
<link rel="apple-touch-icon" href="apple-touch-icon.png">


<link rel="stylesheet" href="style.css">

</head>
<body>
  <h1>Мои задачи</h1>


<div class="filters">
  <div class="category-filters">
    <button class="filter-button active" data-category="Все" type="button">
      Все
    </button>
    <button class="filter-button" data-category="Работа" type="button">
      Работа
    </button>
    <button class="filter-button" data-category="Дом" type="button">
      Дом
    </button>
    <button class="filter-button" data-category="Личное" type="button">
      Личное
    </button>
  </div>

  <button id="undatedFilterButton" class="undated-filter-button" type="button" aria-pressed="false">
    Без даты
  </button>
</div>




<div class="calendar-card">
  <button class="calendar-toggle" id="calendarToggle" type="button"
          aria-expanded="false" aria-controls="calendarContent">
    <span>📅 Календарь</span>
    <span id="calendarArrow">▾</span>
  </button>

  <div class="calendar-content" id="calendarContent">
    <div class="calendar-header">
      <button id="prevMonth" type="button" aria-label="Предыдущий месяц">‹</button>
      <h2 id="monthTitle">Октябрь 2026</h2>
      <button id="nextMonth" type="button" aria-label="Следующий месяц">›</button>
    </div>

  <button id="todayButton" class="today-button" type="button">
    Сегодня
  </button>

  <div class="calendar-weekdays">
    <span>Пн</span>
    <span>Вт</span>
    <span>Ср</span>
    <span>Чт</span>
    <span>Пт</span>
    <span>Сб</span>
    <span>Вс</span>
  </div>

  <div id="calendarDays" class="calendar-days"></div>

    <div class="calendar-footer">
    <span class="calendar-dot"></span>
    <span>Количество задач на день</span>
  </div>

  <button id="clearDateFilter" class="all-dates-button" type="button">
    Показать все даты
  </button>
  </div>
</div>

<input id="filterDate" type="hidden" value="">



<div class="progress-card">
  <div class="stats">
    <div class="stat">
      <span id="activeCount">0</span>
      <span>Активных</span>
    </div>
    <div class="stat">
      <span id="doneCount">0</span>
      <span>Выполнено</span>
    </div>
  </div>

  <div class="progress-info">
    <span>Общий прогресс</span>
    <span id="progressPercent">0%</span>
  </div>

  <div class="progress-track">
    <div id="progressBar" class="progress-fill"></div>
  </div>
</div>

 


<div class="task-creation">
  <div class="task-creation-buttons">
    <button id="createDatedTaskButton" type="button">
      + Создать задачу на выбранную дату
    </button>

    <button id="createUndatedTaskButton" type="button">
      + Создать задачу без даты
    </button>
  </div>

  <div class="add-task" id="addTaskForm" hidden>
    <h2 id="taskFormTitle">Новая задача</h2>

    <input id="taskInput" placeholder="Что нужно сделать?">

    <select id="categoryInput">
      <option value="Работа">Работа</option>
      <option value="Дом">Дом</option>
      <option value="Личное">Личное</option>
    </select>

    <input id="dateInput" type="date" aria-label="Срок выполнения">

    <textarea
      id="commentInput"
      placeholder="Комментарий к задаче (необязательно)"
      rows="2"
    ></textarea>

    <button id="addButton" type="button">Добавить задачу</button>
    <button id="cancelTaskButton" type="button">Отмена</button>
  </div>
</div>



  <ul id="taskList"></ul>

 <script src="script.js"></script>

</body>
</html>
